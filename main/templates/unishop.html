{% extends "layout.html" %}

{% block universities_active %}menu-active{% endblock %}

{% block body %}

<form class="flex flex-col gap-4 p-4 min-h-200" action="{% url 'unishop' %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% if id %}<input type="hidden" name="id" value="{{ id }}">{% endif %}
  <input type="hidden" name="action" value="{% if action %}{{ action }}{% else %}new{% endif %}">
  
  <fieldset class="fieldset w-full max-w-md mx-auto">
    <label class="fieldset-legend" for="name">Name</label>
    <input type="text" id="name" name="name" class="input w-full" placeholder="University" {% if edittitle %}value="{{ edittitle }}"{% endif %} required>
  </fieldset>

  <fieldset class="fieldset w-full max-w-md mx-auto">
    <label class="fieldset-legend" for="country">Country</label>
    <input type="text" id="country" name="country" class="input w-full" placeholder="Country" {% if editcountry %}value="{{ editcountry }}"{% endif %} required>
  </fieldset>

  <fieldset class="fieldset w-full max-w-md mx-auto">
    <label class="fieldset-legend" for="city">City</label>
    <input type="text" id="city" name="city" class="input w-full" placeholder="City" {% if editcity %}value="{{ editcity }}"{% endif %} required>
  </fieldset>

  <fieldset class="fieldset w-full max-w-md mx-auto">
    <label class="fieldset-legend" for="portal">Portal URL</label>
    <input type="url" id="portal" name="portal" class="input validator w-full" placeholder="https://" value="{% if editportal %}{{ editportal }}{% endif %}"
    pattern="^(https?://)?([a-zA-Z0-9]([a-zA-Z0-9-].*[a-zA-Z0-9])?.)+[a-zA-Z].*$" 
    title="Must be valid URL" />
    <div class="label">Optional</div>
  </fieldset>

  <fieldset class="fieldset flex-1 flex flex-col mx-auto w-200 max-w-75-sc">
    <legend class="fieldset-legend">Description</legend>
    <textarea class="textarea w-full flex-1 min-h-48 resize-none" name="note" placeholder="Notes, Links, etc.">{% if editcontent %}{{ editcontent }}{% endif %}</textarea>
    <div class="label">Optional</div>
  </fieldset>

  <button class="btn btn-primary w-full max-w-md mx-auto" type="submit">Save</button>
</form>

{% endblock %}
