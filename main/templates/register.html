{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Register</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="{% static 'logo.png' %}">
        <link href="{% static 'style.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="flex flex-col items-center justify-center text-center h-screen">

        <form method="post">
            {% csrf_token %}

            <p>
                <label class="input validator">
                    <span style="font-family: 'JetBrainsMono Nerd Font';"></span>
                    <input
                        type="text"
                        required
                        placeholder="Username"
                        pattern="[A-Za-z0-9\-]*"
                        minlength="3"
                        maxlength="30"
                        title=""
                        name="username"
                    />
                </label>
                <p class="label">Only letters, numbers or dash</p>
                <br><br>
            </p>

            <p>
                <label class="input validator">
                    <span style="font-family: 'JetBrainsMono Nerd Font';">󰇮</span>
                    <input type="email" title="" name="email" placeholder="mail@site.com" required />
                </label>
                <br><br>
            </p>
            
            <p>
                <label class="input validator">
                    <span style="font-family: 'JetBrainsMono Nerd Font';"></span>
                    <input
                        type="password"
                        required
                        placeholder="Password"
                        minlength="8"
                        title=""
                        name="password"
                    />
                </label>
                <p class="label">Must be more than 8 characters</p>
                <br><br>
            </p>
            <button class="btn btn-primary" type="submit">Register</button>
            <br><br>
        </form>

        {% if message %}
            <div role="alert" class="alert alert-error">
                    <span style="font-family: 'JetBrainsMono Nerd Font';"></span>
                <span>{{ message }}</span>
                    </div><br>
        {% endif %}

        <p>Already have an account? <a class="text-info" href="{% url 'login' %}">Login here</a>.</p>
        </div>
    </body>
</html>
