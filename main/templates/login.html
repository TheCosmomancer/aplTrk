{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="{% static 'logo.png' %}" sizes="512x512" />
        <link href="{% static 'style.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="flex flex-col items-center justify-center text-center h-screen">

        <form method="post">
            {% csrf_token %}

            <p>
                <label class="input validator">
                    <span style="font-family: 'JetBrainsMono Nerd Font';"></span>
                    <input
                        type="text"
                        required
                        placeholder="Username"
                        pattern="[A-Za-z][A-Za-z0-9\-]*"
                        minlength="3"
                        maxlength="30"
                        title=""
                        name="username"
                    />
                </label>
                <br><br>
            </p>

            <p>
                <label class="input validator">
                    <span style="font-family: 'JetBrainsMono Nerd Font';"></span>
                    <input
                        type="password"
                        required
                        placeholder="Password"
                        minlength="8"
                        title=""
                        name="password"
                    />
                </label>
                <br><br>
            </p>
            <button class="btn btn-primary" type="submit">Log In</button>
            <br><br>
        </form>

        {% if message %}
            <div role="alert" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ message }}</span>
                    </div><br>
        {% endif %}

        <p>Don't have an account? <a class="text-info" href="{% url 'register' %}">Register here</a>.</p>
        </div>
    </body>
</html>
