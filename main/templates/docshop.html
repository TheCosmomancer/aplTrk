{% extends "layout.html" %}

{% block documents_active %}menu-active{% endblock %}

{% block body %}

<form class="flex flex-col gap-4 p-4 min-h-200" action="{% url 'docshop' %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% if id %}<input type="hidden" name="id" value="{{ id }}">{% endif %}
  <input type="hidden" name="action" value="{% if action %}{{ action }}{% else %}new{% endif %}">
  <fieldset class="fieldset w-full max-w-md mx-auto">
    <label class="fieldset-legend" for="title">Title</label>
    <input type="text" id="title" name="title" class="input w-full" placeholder="Document" {% if edittitle %}value="{{ edittitle }}"{% endif %} required>
  </fieldset>

  <fieldset class="fieldset flex-1 flex flex-col mx-auto w-200 max-w-75-sc">
    <legend class="fieldset-legend">Description</legend>
    <textarea class="textarea w-full flex-1 min-h-48 resize-none" name="content" placeholder="Notes, Links, etc.">{% if editcontent %}{{ editcontent }}{% endif %}</textarea>
    <div class="label">Optional</div>
  </fieldset>

  <fieldset class="fieldset w-md max-w-75-sc mx-auto">
    <legend class="fieldset-legend">{% if action == 'edit' %}Replace{% else %}Attach{% endif %} File</legend>
    <input type="file" name="document" class="file-input w-full" accept=".pdf,.jpg,.jpeg,.png,.webp">
    <label class="label">Optional . Max size 10MB . Images and PDFs</label>
  </fieldset>

  <button class="btn btn-primary w-full max-w-md mx-auto" type="submit">Save</button>
</form>

{% endblock %}
